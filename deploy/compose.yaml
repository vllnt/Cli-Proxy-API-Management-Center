services:
  cliproxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${CLIPROXY_IMAGE_REF:?pinned image reference required}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    volumes:
      - /data/cliproxy01/state:/state
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1:8317/healthz"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

  gateway:
    image: nginxinc/nginx-unprivileged@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    restart: unless-stopped
    read_only: true
    user: "101:101"
    ports:
      - "127.0.0.1:18317:8443"
    volumes:
      - /data/cliproxy01/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/cliproxy01/tls:/etc/cliproxy-tls:ro
      - /data/cliproxy01/ops:/var/lib/cliproxy-ops:ro
      - /data/cliproxy01/backups:/var/lib/cliproxy-backups:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      cliproxy: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
